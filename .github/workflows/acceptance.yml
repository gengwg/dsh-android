---
name: Real server acceptance

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Android CI run that built the release APK
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: >-
          lumbroso-commons/free-disk-space@cf1e78c50ca91e757bab3edc229027eebfc07871
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          preinstalled-runtimes: false
          swap-storage: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Download release APK from Android CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dsh-android-${{ inputs.build_run_id }}
          path: android/app/build/outputs/apk/release
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable KVM for Android emulation
        run: |
          echo \
            'KERNEL=="kvm", GROUP="kvm", MODE="0666",' \
            'OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: >-
          reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: medium_phone
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -no-audio
          script: bash .github/scripts/acceptance.sh
        env:
          DSH_TEST_SERVER_URL: ${{ secrets.DSH_TEST_SERVER_URL }}
          DSH_TEST_LAUNCH_TOKEN: ${{ secrets.DSH_TEST_LAUNCH_TOKEN }}
